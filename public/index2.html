    <!--orderd lists-->
    <ol>

            <th>Header 3</th>

        </tr>

            <td>Data 1</td>

            <td>Data 3</td>

        </tr>
        <tr>

            </tr>
        </table>
     <!--table row breaks into a new line and its denoted by <tr>-->

            <!--table data is the data of the table and its normal text and its denoted by td and starts from the left-->
