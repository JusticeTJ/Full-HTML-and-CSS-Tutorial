<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/sinup.css">
</head>
<body>
    <section class="signup">
  <h2>Sign Up</h2>
  <form>
    <label for="name">First Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your first name " required>

    <label for="name">Last Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your last name " required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Create a password" required>

    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>

    <button type="submit" ><a href="login.html"></a>Sign Up</button>
    
  </form>
  <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
</section>

</body>
</html>
