<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- i can still add a style boarder 3px solid and give it a width of 500px -->
    <h1 style="font-size: medium; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Employee referral form template</h1>
    <label style="font-size: small; line-height: 2;">Date</label><br>
    <input type="date"><br><br>
    <label style="font-size: small; line-height: 2;">Applicant's Name</label><br>
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last"><br><br>
    <label style="font-size: small; line-height: 2;">Applicant's phone</label><br>
    <input type="number"><br><br>
    <label style="font-size: small; line-height: 2;">Applicant's email</label><br>
    <input type="email" placeholder="johndoe@example.com"><br><br>
    <p style="font-weight: bold; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; font-size: small;">Referral position</p>
    <label style="font-size: small; line-height: 2;">Name and Title of position</label><br>
    <input type="text"><br><br>
    <p style="font-weight: bold; font-size: small; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Referred by:</p>
    <label style="font-size: small; line-height: 2;">Employee name</label><br>
    <input type="text" placeholder="first">
    <input type="text" placeholder="last"><br><br>
    <label style="font-size: small; line-height: 2;">Title</label><br>
    <input type="text"><br><br>
    <label style="line-height: 2; font-size: small;">Phone</label><br>
    <input type="number"><br><br>
    <label style="line-height: 2; font-size: small;">Email</label><br>
    <input type="email" placeholder="johndoe@example.com"><br><br>
    <label style="font-size: small; line-height: 2;">Department name</label><br>
    <input type="text"><br><br>
    <label style="line-height: 2; font-size: small;">Address</label><br>
    <input type="text" placeholder="Adress line 1"><br><br>
    <input type="text" placeholder="City">
    <select name="Religion">
        <option>Christain</option>
        <option>Islam</option>
        <option>Budist</option>
        <option>Jewish</option>
    </select>
    <select name="country">
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Nigeria</option>
        <option>Canada</option>
    </select><br><br>
    <label style="line-height: 2; font-size: small;">Signature</label><br>
    <input type="text"><br><br>
    <button>print</button>
    <input type="submit">




</body>
</html>
