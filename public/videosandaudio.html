<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video-audio</title>
</head>
<body>
<!-- to add a video to a wab page -->
    <div>
        <video width="320px" controls>
            <source src="/video/ssstwitter.com_1772180940247.mp4" type="video/mp4"> 
        </video>
<!-- some videos on YouTube are barred from using in other websites e.g champions league page videos  -->
        <iframe width="560" height="315" src="https://www.youtube.com/embed/eSFSMaHhsq4?si=X99M6-_kD8wjwakb" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
     <iframe width="560" height="315" src="https://www.youtube.com/embed/RGaW82k4dK4?si=GvPdzBPhjMJ3Tac7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<!-- to add audio to your web page
 you can also use autoplay if u want the audio to auto play as well as the video -->
    <audio controls>
        <source src="/Audio/Eminem_-_Godzilla_ft._Juice_WRLD_Instrumental_(mp3.pm).mp3" type="audio/mpeg">
    </audio>
    <!-- to embed another web page in your web page -->
    <iframe src="aboutmyself.html" frameborder="0"></iframe>
    <!-- to link or direct to a new page if u remove the blankl it opens in the same page instead of opening a new page -->
    <a href="/public/goal.html" target="_blank">home</a>
    <!-- we can also put the <a href="" in the i frame by giving the iframe a name like  <iframe src="aboutmyself.html" name="justice"></iframe> then replace the blank on the <a href=" with the name of thr iframe" -->


</body>
</html>
